server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed, so it can be cached hard; index.html is not
    # and must never be, or a deploy would keep serving the old asset names.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires    -1;
    }

    # Vite emits `name-HASH.ext`, so the name changes whenever the bytes do.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|gif|wasm|mp3|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # The client opens its MTProto transports on this origin (see
    # src/lib/mtproto/dcConfigurator.ts): wss://<host>/apiws and
    # https://<host>/apiw1. They are reverse-proxied to the DC upstream of this
    # container, so they must NOT be answered from the filesystem.
    location /apiws { return 426; }
    location /apiw1  { return 426; }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    server_tokens off;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
}