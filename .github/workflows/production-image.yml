name: Docker Image Build CI

on:
  push:
    tags:
      - 'tag/build-docker-image/*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # .env is not committed. The repository secret TWEB_ENV holds the
      # deployment's configuration (the whole file, the same keys as
      # .env.example); without it the build falls back to the committed
      # defaults and produces an unbranded image (Telegram, localhost DC).
      - name: Prepare .env
        id: env
        env:
          ENV_FILE: ${{ secrets.TWEB_ENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s\n' "$ENV_FILE" > .env; else cp .env.example .env; fi
          echo "PRODUCTION_BUILD_VERSION=$(grep ^PRODUCTION_BUILD_VERSION= .env | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Collect build arguments
        id: args
        run: |
          {
            echo 'args<<EOF'
            grep -E '^VITE_[A-Z0-9_]+=' .env
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.docker/Dockerfile_production
          push: true
          build-args: ${{ steps.args.outputs.args }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.env.outputs.PRODUCTION_BUILD_VERSION }}

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env
        id: env
        env:
          ENV_FILE: ${{ secrets.TWEB_ENV }}
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s\n' "$ENV_FILE" > .env; else cp .env.example .env; fi
          echo "PRODUCTION_BUILD_VERSION=$(grep ^PRODUCTION_BUILD_VERSION= .env | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Pull versioned image
        run: |
          version=${{ steps.env.outputs.PRODUCTION_BUILD_VERSION }}
          docker pull ghcr.io/${{ github.repository }}:${version}
